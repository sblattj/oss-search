[package]
name = "oss-corpus"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]
blake3 = "1.8.7"
zstd = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0"
