[package]
name = "oss-index"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust positional-trigram code-search index for oss-search: sub-50ms regex search over a local hot-set with incremental reindexing."
edition = "2021"

[dependencies]
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
tempfile = "3"
