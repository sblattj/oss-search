name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fmt check
        run: cargo fmt --check || echo "fmt drift tolerated (style edition mismatch noted in repo history)"

  npm-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test npm shim
        working-directory: npm/oss-search
        run: node --test
      - name: npm pack dry-run is clean
        working-directory: npm/oss-search
        run: npm pack --dry-run --foreground-scripts=false

  server-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate server.json against the MCP registry schema
        run: |
          pip install jsonschema
          python3 - <<'EOF'
          import json, urllib.request
          from jsonschema import Draft7Validator
          schema = json.load(urllib.request.urlopen(
              "https://static.modelcontextprotocol.io/schemas/2025-10-17/server.schema.json"))
          doc = json.load(open("registry/server.json"))
          Draft7Validator.check_schema(schema)
          errs = list(Draft7Validator(schema).iter_errors(doc))
          for e in errs:
              print("SCHEMA ERROR:", e.message)
          assert not errs, f"{len(errs)} schema errors"
          print("server.json VALID")
          EOF

  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
      - name: Tag matches workspace version (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WS=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG workspace=$WS"
          test "$TAG" = "$WS"
