# Cross-compiled release builds for oss-mcp + oss-cli.
#
# Trigger: push a tag `v*` (e.g. v0.2.0) -> builds, uploads artifacts, and
# attaches assets to the GitHub Release named after the tag.
# Then the npm job publishes the npm/oss-search shim and the crates job
# publishes the workspace crates to crates.io (both via trusted publishing).
# Trigger: workflow_dispatch -> dry-run build; artifacts only, no Release
# (pass the `version` input, or leave empty to use the workspace version).
#
# Build decisions:
# - Only the two shipped binaries are built (-p oss-mcp -p oss-cli). Their
#   dependency graph is pure Rust (serde/clap/tokio/rmcp/reqwest+rustls);
#   fastembed, tree-sitter, and rusqlite live in oss-semantic, which these
#   binaries do not depend on, so release builds have NO fastembed and need
#   no C compiler.
# - reqwest uses rustls (no OpenSSL), so Linux targets need no pkg-config/libssl.
# - Linux aarch64 builds natively on the ubuntu-24.04-arm runner (no cross or
#   cargo-zigbuild needed). macOS x86_64 is a supported arm64->x86_64
#   cross-compile on the macos-latest (arm64) runner via the Apple SDK.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for asset naming (default: [workspace.package] version from Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runs-on: macos-latest
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Resolve version
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_VERSION}" ]]; then
            version="${DISPATCH_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # fall back to the workspace version ([workspace.package] in the root manifest)
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          fi
          if [[ -z "${version}" ]]; then
            echo "::error::could not resolve version (set the workflow_dispatch 'version' input or fix the workspace manifest)" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build (locked)
        run: cargo build --release --locked --target ${{ matrix.target }} -p oss-mcp -p oss-cli

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="oss-search-${VERSION}-${TARGET}"
          mkdir "${name}"
          cp "target/${TARGET}/release/oss-mcp" "target/${TARGET}/release/oss-cli" "${name}/"
          tar czf "${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oss-search-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: oss-search-*.tar.gz*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: |
            oss-search-*.tar.gz
            oss-search-*.tar.gz.sha256

  # Publishes the npm/oss-search shim after every target's binaries are on the
  # Release (the shim downloads them on first run, so publishing first would
  # hand out a package that 404s). Auth is npm trusted publishing: npmjs.com ->
  # oss-search -> Settings -> Trusted Publisher lists GitHub Actions, repository
  # sblattj/oss-search, workflow release.yml, no environment. No NPM_TOKEN.
  npm:
    name: publish npm shim
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/oss-search
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - name: Check the tag matches the shim version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match npm/oss-search/package.json version ${version}"
            exit 1
          fi

      - run: npm test

      - name: Publish
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "oss-search@${version}" version >/dev/null 2>&1; then
            echo "::notice::oss-search@${version} is already on npm; skipping publish"
            exit 0
          fi
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish of oss-search@${version} failed. Check the package's Trusted Publisher (GitHub Actions, sblattj/oss-search, release.yml, no environment)."
            exit 1
          fi

  # Publishes the 11 workspace crates to crates.io, dependencies first, so
  # `cargo install oss-cli` / `cargo install oss-mcp` track the release.
  # Auth is crates.io trusted publishing: each crate's Settings -> Trusted
  # Publishing lists GitHub, repository sblattj/oss-search, workflow
  # release.yml, no environment. No CARGO_REGISTRY_TOKEN secret.
  # Re-runnable: a crate whose version is already on crates.io is skipped.
  crates:
    name: publish crates
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check the tag matches the workspace version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${version}"
            exit 1
          fi

      - name: Get a crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish (dependencies first)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for crate in oss-core oss-corpus oss-facade oss-index oss-query oss-rank \
                       oss-semantic oss-eval oss-live oss-cli oss-mcp; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A 'oss-search-release (github.com/sblattj/oss-search)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [[ "${code}" == "200" ]]; then
              echo "::notice::${crate}@${version} is already on crates.io; skipping"
              continue
            fi
            # cargo waits for each crate to reach the index before returning,
            # so the next crate can resolve it.
            cargo publish --locked -p "${crate}"
          done
