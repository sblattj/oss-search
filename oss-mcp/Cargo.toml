[package]
name = "oss-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
oss-core = { path = "../oss-core" }
oss-live = { path = "../oss-live" }
serde_json = "1"
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
