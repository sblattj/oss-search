[package]
name = "oss-facade"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed HTTP clients for oss-search's live backends: GitHub code search, grep.app, npms.io, and deps.dev, with rate limiting."
edition = "2024"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
